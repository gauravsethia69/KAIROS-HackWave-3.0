name: KAIROS deployment gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Ensure deployed source is complete and public-safe
        run: python scripts/deploy_preflight.py --strict
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend regression suite (offline)
        run: python -m unittest discover -s backend/tests -v
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend types and tests
        run: npm run typecheck && npm run test
      - name: Production build
        run: npm run build
